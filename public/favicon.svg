<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#081427" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(0, 194, 255, 0.4)" stroke-width="6" />

  <!-- The 3 Cats Vector Line Isotype (from demo1.jpeg & demo2.jpeg) -->
  <g transform="translate(64, 110) scale(2.6)">
    <!-- Cat 3 (Rear - Crisp White) -->
    <g transform="translate(54, 0)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
    </g>

    <!-- Cat 2 (Middle - Ice Cyan) -->
    <g transform="translate(27, 0)" stroke="#38BDF8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
    </g>

    <!-- Cat 1 (Front - Electric Cyan with Number 3) -->
    <g stroke="url(#cyanGrad)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
      <path d="M 16,50 L 46,50 C 58,50 60,60 54,67 C 49,72 38,73 24,73 M 24,73 C 44,73 60,78 58,91 C 56,101 44,105 26,104 C 18,103 12,100 8,96" />
    </g>
  </g>
</svg>