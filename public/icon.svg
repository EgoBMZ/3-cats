<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="160" height="160" rx="36" fill="#030712" />
  <rect width="158" height="158" x="1" y="1" rx="35" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />

  <g transform="translate(24, 18) scale(0.72)">
    <!-- 3rd Cat (Back) -->
    <g transform="translate(52, 10)" opacity="0.4" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,42 L24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <path d="M24,6 L12,25" />
    </g>

    <!-- 2nd Cat (Middle) -->
    <g transform="translate(26, 5)" opacity="0.75" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,42 L24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <path d="M24,6 L12,25" />
    </g>

    <!-- 1st Cat (Front - with stylized 3) -->
    <g stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <path d="M24,6 L12,25" />
      <path d="M12,25 C-4,35 -6,52 6,66 C14,75 25,78 35,78" />
      <path d="M35,78 C18,78 -4,88 -6,110 C-8,132 10,148 32,148 C40,148 48,145 54,140" />
      <line x1="16" y1="78" x2="35" y2="78" stroke-width="4.5" />
    </g>
  </g>
</svg>