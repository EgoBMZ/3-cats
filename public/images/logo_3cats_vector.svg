<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cyan3CatsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>
    <filter id="cyanNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ISOTYPE: 3 LAYERED CAT SILHOUETTES -->
  <g transform="translate(5, 5)">
    <!-- 3rd Cat (Back - Crisp Silver/White 35% opacity) -->
    <g transform="translate(64, 10)" opacity="0.4" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Ear & Head Profile -->
      <path d="M12,42 L24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <!-- Secondary Inner Ear Peak -->
      <path d="M24,6 L12,25" />
    </g>

    <!-- 2nd Cat (Middle - Ice Cyan 70% opacity) -->
    <g transform="translate(32, 5)" opacity="0.75" stroke="#38BDF8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Ear & Head Profile -->
      <path d="M12,42 L24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <path d="M24,6 L12,25" />
    </g>

    <!-- 1st Cat (Front - Electric Cyan with Number 3 contour) -->
    <g stroke="url(#cyan3CatsGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanNeonGlow)">
      <!-- Front Ear and Facial Profile -->
      <path d="M24,6 L38,28 C45,30 56,40 60,50 C63,57 61,65 56,71 C51,76 45,82 45,92 C45,104 53,115 50,128 C48,135 43,142 38,148" />
      <!-- Back of Ear -->
      <path d="M24,6 L12,25" />
      <!-- Left side: The stylized number 3 seamlessly integrated into cat body -->
      <!-- Top horizontal bar and upper arc of the 3 -->
      <path d="M12,25 C-4,35 -6,52 6,66 C14,75 25,78 35,78" />
      <!-- Middle cusp and lower arc of the 3 -->
      <path d="M35,78 C18,78 -4,88 -6,110 C-8,132 10,148 32,148 C40,148 48,145 54,140" />
      <!-- Middle inner stroke connecting the 3 -->
      <line x1="16" y1="78" x2="35" y2="78" stroke-width="3.2" />
    </g>
  </g>

  <!-- WORDMARK: 3 C Λ T S -->
  <g transform="translate(195, 20)">
    <!-- Number 3 in Electric Cyan -->
    <g fill="none" stroke="url(#cyan3CatsGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanNeonGlow)">
      <path d="M5,12 L38,12 C44,12 48,16 48,22 C48,30 42,35 34,35 C44,35 50,40 50,50 C50,58 44,64 36,64 L5,64" />
      <line x1="22" y1="35" x2="35" y2="35" stroke-width="5" />
    </g>

    <!-- C in Crisp White -->
    <g transform="translate(70, 0)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48,16 C42,12 34,10 26,10 C12,10 2,21 2,37 C2,53 12,64 26,64 C34,64 42,62 48,58" />
    </g>

    <!-- Λ (Inverted chevron A) in Crisp White -->
    <g transform="translate(138, 0)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2,64 L26,12 L50,64" />
      <!-- Subtle modern center dot inside chevron apex -->
      <circle cx="26" cy="38" r="2.5" fill="#00E5FF" stroke="none" />
    </g>

    <!-- T in Crisp White -->
    <g transform="translate(208, 0)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="12" x2="48" y2="12" />
      <line x1="25" y1="12" x2="25" y2="64" />
    </g>

    <!-- S in Crisp White -->
    <g transform="translate(274, 0)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M44,18 C38,12 30,10 22,10 C10,10 4,18 4,26 C4,36 14,40 26,43 C38,46 46,50 46,58 C46,65 38,70 24,70 C14,70 6,66 2,60" />
    </g>

    <!-- SUBTITLE: SOFTWARE DEVELOPMENT & PROJECT DELIVERY -->
    <text x="2" y="88" fill="#94A3B8" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.22em" text-anchor="start">
      SOFTWARE DEVELOPMENT &amp; PROJECT DELIVERY
    </text>
  </g>
</svg>