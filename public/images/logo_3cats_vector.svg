<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077FF" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Isotype (3 Cats in line art) -->
  <g transform="translate(25, 20)">
    <!-- Cat 3 (Rear - White) -->
    <g transform="translate(54, 0)" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
    </g>

    <!-- Cat 2 (Middle - Ice Cyan) -->
    <g transform="translate(27, 0)" stroke="#38BDF8" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
    </g>

    <!-- Cat 1 (Front - Electric Cyan with Number 3) -->
    <g stroke="url(#cyanGlow)" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M 16,50 C 20,32 34,18 52,10 C 60,7 68,8 72,13 L 72,28 C 78,37 84,45 88,51 C 84,55 81,57 78,58 C 73,61 70,66 69,72 C 68,80 71,90 77,98 L 80,104" />
      <path d="M 76,27 L 83,18 L 83,26" />
      <path d="M 16,50 L 46,50 C 58,50 60,60 54,67 C 49,72 38,73 24,73 M 24,73 C 44,73 60,78 58,91 C 56,101 44,105 26,104 C 18,103 12,100 8,96" />
    </g>
  </g>

  <!-- Typography: 3 C Λ T S -->
  <g transform="translate(190, 48)">
    <text x="0" y="48" fill="url(#cyanGlow)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="50" letter-spacing="0.05em" filter="url(#glow)">3</text>
    <text x="42" y="48" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="50" letter-spacing="0.24em"> C Λ T S</text>
    <text x="2" y="76" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" letter-spacing="0.16em">SOFTWARE DEVELOPMENT &amp; PROJECT DELIVERY</text>
  </g>
</svg>