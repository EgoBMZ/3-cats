<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200" fill="none">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background for preview -->
  <rect width="100%" height="100%" fill="#030712" />

  <!-- 3rd Cat (Back - silver/white) -->
  <g transform="translate(54, 0)" opacity="0.4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48,38 L54,20 L66,35 C72,36 82,44 86,52 C89,58 87,66 82,72 C78,76 72,82 72,92 C72,106 82,120 78,136 C76,144 70,152 64,158" />
    <path d="M54,20 L40,36" />
  </g>

  <!-- 2nd Cat (Middle - ice cyan) -->
  <g transform="translate(27, 0)" opacity="0.75" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48,38 L54,20 L66,35 C72,36 82,44 86,52 C89,58 87,66 82,72 C78,76 72,82 72,92 C72,106 82,120 78,136 C76,144 70,152 64,158" />
    <path d="M54,20 L40,36" />
  </g>

  <!-- 1st Cat (Front - Cyan with number 3 integrated into body) -->
  <g stroke="url(#cyanGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Cat head and ear -->
    <path d="M48,38 L54,20 L66,35 C72,36 82,44 86,52 C89,58 87,66 82,72 C78,76 72,82 72,92 C72,106 82,120 78,136 C76,144 70,152 64,158" />
    <path d="M54,20 L40,36" />
    <!-- Front contour shaping the number 3 -->
    <path d="M40,36 C30,42 22,54 22,70 C22,86 34,96 46,96 C30,96 16,110 16,132 C16,154 34,168 56,168 C66,168 76,164 82,158" />
    <!-- Inner bar of 3 -->
    <line x1="24" y1="96" x2="46" y2="96" stroke-width="4" />
  </g>
</svg>